<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
    <script src="/js/dark-mode.js" defer></script>
    <script src="/js/theme-switcher.js" defer></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .profile-container {
            max-width: 750px;
            margin: 30px auto;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 28px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .profile-container:hover {
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
        }

        .profile-container h2 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .profile-container .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .profile-container label {
            color: white;
            font-weight: 500;
            font-size: 14px;
        }
        .profile-container .form-control {
            background: rgba(255,255,255,0.12) !important;
            border: 1px solid rgba(255,255,255,0.2) !important;
            color: white !important;
            border-radius: 16px;
            padding: 12px 18px;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        .profile-container .form-control::placeholder {
            color: rgba(255,255,255,0.4);
        }
        .profile-container .form-control:focus {
            background: rgba(255,255,255,0.2) !important;
            border-color: rgba(255,255,255,0.5) !important;
            box-shadow: 0 0 30px rgba(255,255,255,0.06);
        }
        .profile-container .form-control:disabled {
            opacity: 0.5;
        }

        .profile-container .btn-glass {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 15px;
        }
        .profile-container .btn-glass:hover {
            background: rgba(255,255,255,0.25);
            color: white;
            transform: translateY(-2px) scale(1.02);
        }
        .profile-container .btn-glass.success {
            background: rgba(46,204,113,0.5);
        }
        .profile-container .btn-glass.primary {
            background: rgba(102,126,234,0.5);
        }
        .profile-container .btn-glass.warning {
            background: rgba(241,196,15,0.5);
        }

        .top-bar {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar h1 {
            color: white;
            font-weight: 700;
            margin: 0;
            font-size: 20px;
        }
        .top-bar .user-info {
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        .top-bar .user-info .logout-btn {
            color: #ff6b6b;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .top-bar .user-info .logout-btn:hover {
            color: #ff4757;
        }
        .top-bar .back-link {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .top-bar .back-link:hover {
            color: white;
        }

        .avatar-upload {
            text-align: center;
            margin-bottom: 30px;
        }
        .avatar-upload .avatar-wrapper {
            display: inline-block;
            position: relative;
        }
        .avatar-upload img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .avatar-upload img:hover {
            transform: scale(1.02);
            border-color: rgba(255,255,255,0.4);
        }
        .avatar-upload .upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: rgba(102,126,234,0.8);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }
        .avatar-upload .upload-btn:hover {
            background: #667eea;
            transform: scale(1.1);
        }

        .tabs-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.5);
            padding: 8px 22px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .tab-btn:hover {
            color: rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.05);
        }
        .tab-btn.active {
            color: white;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .activity-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.8);
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        .activity-item:last-child { border-bottom: none; }
        .activity-item .activity-action { font-weight: 500; }
        .activity-item .activity-date { color: rgba(255,255,255,0.4); font-size: 12px; }

        .small-note {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            margin-top: 4px;
        }

        @media (max-width: 576px) {
            .profile-container {
                padding: 25px 20px;
                margin: 15px;
                border-radius: 20px;
            }
            .top-bar {
                flex-direction: column;
                gap: 8px;
                align-items: flex-start;
            }
            .avatar-upload img {
                width: 90px;
                height: 90px;
            }
        }
    </style>
</head>
<body>
<div class="profile-container">
    <!-- Top Bar -->
    <div class="top-bar">
        <a href="/dashboard" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        <div class="user-info">
            <i class="fas fa-user-circle" style="font-size:20px;"></i>
            <span id="displayName">Admin</span>
            <a href="/logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>

    <h2>👤 My Profile</h2>
    <p class="subtitle">Manage your personal information and preferences</p>

    <!-- Avatar -->
    <div class="avatar-upload">
        <div class="avatar-wrapper">
            <img id="avatarPreview" src="https://ui-avatars.com/api/?name=Admin&background=667eea&color=fff&size=120&bold=true" alt="Avatar">
            <label class="upload-btn" for="avatarInput"><i class="fas fa-camera"></i></label>
            <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="uploadAvatar(this)">
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs-container">
        <button class="tab-btn active" data-tab="edit-profile"><i class="fas fa-user-edit"></i> Edit Profile</button>
        <button class="tab-btn" data-tab="change-password"><i class="fas fa-lock"></i> Change Password</button>
        <button class="tab-btn" data-tab="activity"><i class="fas fa-history"></i> Activity</button>
    </div>

    <!-- Tab: Edit Profile -->
    <div id="tab-edit-profile" class="tab-content active">
        <form id="profileForm">
            <div class="mb-3">
                <label>Full Name</label>
                <input type="text" id="fullName" class="form-control" placeholder="Your full name" required>
            </div>
            <div class="mb-3">
                <label>Email</label>
                <input type="email" id="email" class="form-control" disabled>
                <div class="small-note">Email cannot be changed</div>
            </div>
            <div class="mb-3">
                <label>Role</label>
                <input type="text" id="role" class="form-control" disabled>
            </div>
            <button type="submit" class="btn-glass success w-100"><i class="fas fa-save"></i> Update Profile</button>
        </form>
    </div>

    <!-- Tab: Change Password -->
    <div id="tab-change-password" class="tab-content">
        <form id="passwordForm">
            <div class="mb-3">
                <label>Current Password</label>
                <input type="password" id="oldPassword" class="form-control" placeholder="Enter current password" required>
            </div>
            <div class="mb-3">
                <label>New Password</label>
                <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" required minlength="6">
            </div>
            <div class="mb-3">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm new password" required>
            </div>
            <button type="submit" class="btn-glass primary w-100"><i class="fas fa-key"></i> Change Password</button>
        </form>
    </div>

    <!-- Tab: Activity -->
    <div id="tab-activity" class="tab-content">
        <div id="activityLogs">
            <p class="text-center text-white-50 py-3">Loading activity...</p>
        </div>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script>
    toastr.options = { "closeButton": true, "progressBar": true, "positionClass": "toast-top-right", "timeOut": "3000" };

    // ===== Tab Switching =====
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            document.getElementById('tab-' + this.dataset.tab).classList.add('active');
        });
    });

    // ===== Load Profile =====
    function loadProfile() {
        fetch('/api/profile')
            .then(r => r.json())
            .then(user => {
                document.getElementById('fullName').value = user.fullName;
                document.getElementById('email').value = user.email;
                document.getElementById('role').value = user.role || 'USER';
                document.getElementById('displayName').textContent = user.fullName || 'Admin';
                if (user.profilePicture) {
                    document.getElementById('avatarPreview').src = user.profilePicture;
                }
            })
            .catch(() => toastr.error('Failed to load profile'));
    }
    loadProfile();

    // ===== Update Profile =====
    document.getElementById('profileForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const fullName = document.getElementById('fullName').value.trim();
        if (!fullName) { toastr.warning('Full name is required'); return; }
        fetch('/api/profile', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fullName })
        })
            .then(r => r.json())
            .then(user => {
                document.getElementById('displayName').textContent = user.fullName;
                toastr.success('Profile updated successfully!');
            })
            .catch(() => toastr.error('Failed to update profile'));
    });

    // ===== Change Password =====
    document.getElementById('passwordForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const oldPassword = document.getElementById('oldPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        if (!oldPassword || !newPassword) { toastr.warning('All fields are required'); return; }
        if (newPassword !== confirmPassword) { toastr.warning('Passwords do not match'); return; }
        if (newPassword.length < 6) { toastr.warning('Password must be at least 6 characters'); return; }
        fetch('/api/profile/change-password', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ oldPassword, newPassword })
        })
            .then(r => r.json())
            .then(data => {
                toastr.success(data.message);
                document.getElementById('passwordForm').reset();
            })
            .catch(() => toastr.error('Failed to change password'));
    });

    // ===== Upload Avatar =====
    function uploadAvatar(input) {
        const file = input.files[0];
        if (!file) return;
        const formData = new FormData();
        formData.append('file', file);
        fetch('/api/profile/upload-avatar', {
            method: 'POST',
            body: formData
        })
            .then(r => r.json())
            .then(user => {
                document.getElementById('avatarPreview').src = user.profilePicture;
                toastr.success('Avatar uploaded successfully!');
            })
            .catch(() => toastr.error('Failed to upload avatar'));
        input.value = '';
    }

    // ===== Load Activity Logs =====
    function loadActivity() {
        fetch('/api/audit-logs?limit=10')
            .then(r => r.json())
            .then(logs => {
                const container = document.getElementById('activityLogs');
                if (!logs || logs.length === 0) {
                    container.innerHTML = '<p class="text-center text-white-50 py-3">No activity yet.</p>';
                    return;
                }
                let html = '';
                logs.forEach(log => {
                    const date = log.createdAt ? new Date(log.createdAt).toLocaleDateString() : 'N/A';
                    html += `
                        <div class="activity-item">
                            <span class="activity-action">${log.action} - ${log.details || log.entityType}</span>
                            <span class="activity-date">${date}</span>
                        </div>
                    `;
                });
                container.innerHTML = html;
            })
            .catch(() => {
                document.getElementById('activityLogs').innerHTML = '<p class="text-center text-white-50 py-3">No activity logs available.</p>';
            });
    }
    loadActivity();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
