<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolios - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
    <script src="/js/dark-mode.js" defer></script>
    <script src="/js/theme-switcher.js" defer></script>
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .main-wrapper { display: flex; min-height: 100vh; }
        .sidebar {
            width: 280px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255,255,255,0.12);
            padding: 25px 18px;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        [data-theme="dark"] .sidebar { background: rgba(0,0,0,0.4); border-right: 1px solid rgba(255,255,255,0.05); }
        .sidebar .brand { color: white; font-size: 26px; font-weight: 700; text-align: center; padding-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 25px; }
        .sidebar .brand span { color: #ffd700; }
        .sidebar .nav-item { margin-bottom: 4px; }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.7);
            padding: 10px 16px;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        .sidebar .nav-link:hover { background: rgba(255,255,255,0.12); color: white; transform: translateX(4px); }
        .sidebar .nav-link.active { background: rgba(255,255,255,0.18); color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .sidebar .nav-link i { width: 22px; text-align: center; }

        .main-content { margin-left: 280px; padding: 25px 30px; width: calc(100% - 280px); min-height: 100vh; }
        @media (max-width: 768px) {
            .sidebar { width: 75px; padding: 15px 10px; }
            .sidebar .brand { font-size: 18px; }
            .sidebar .nav-link span { display: none; }
            .sidebar .nav-link { justify-content: center; padding: 10px; }
            .main-content { margin-left: 75px; width: calc(100% - 75px); padding: 15px; }
        }

        .top-bar {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            padding: 12px 24px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar h1 { color: white; font-weight: 700; margin: 0; font-size: 22px; }
        .top-bar .user-info { color: white; display: flex; align-items: center; gap: 15px; }
        .top-bar .user-info .logout-btn { color: #ff6b6b; text-decoration: none; font-weight: 500; font-size: 14px; transition: all 0.3s ease; }
        .top-bar .user-info .logout-btn:hover { color: #ff4757; }

        .glass-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 22px 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .glass-card:hover { box-shadow: 0 12px 48px rgba(0,0,0,0.15); }
        .glass-card .card-title { color: white; font-weight: 600; font-size: 17px; }
        .glass-card label { color: white; font-weight: 500; font-size: 14px; }

        .form-control, .form-select {
            background: rgba(255,255,255,0.12) !important;
            border: 1px solid rgba(255,255,255,0.2) !important;
            color: white !important;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.5); }
        .form-control:focus, .form-select:focus {
            background: rgba(255,255,255,0.2) !important;
            border-color: rgba(255,255,255,0.5) !important;
            box-shadow: 0 0 30px rgba(255,255,255,0.05);
        }
        .form-select option { color: #333; }

        .btn-glass {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        .btn-glass:hover { background: rgba(255,255,255,0.25); color: white; transform: translateY(-2px) scale(1.02); }
        .btn-glass.success { background: rgba(46,204,113,0.5); }
        .btn-glass.primary { background: rgba(102,126,234,0.5); }
        .btn-glass.warning { background: rgba(241,196,15,0.5); }
        .btn-glass.danger { background: rgba(231,76,60,0.5); }

        .table { color: white; }
        .table thead th {
            border-bottom: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.8);
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 8px;
        }
        .table tbody td {
            border-bottom: 1px solid rgba(255,255,255,0.06);
            vertical-align: middle;
            padding: 10px 8px;
        }
        .table tbody tr:hover { background: rgba(255,255,255,0.04); }

        .badge-success { background: rgba(46,204,113,0.8); color: white; padding: 4px 14px; border-radius: 20px; font-size: 11px; }
        .badge-warning { background: rgba(241,196,15,0.8); color: white; padding: 4px 14px; border-radius: 20px; font-size: 11px; }

        .preview-img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }
        .preview-img-placeholder {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background: rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 20px;
        }
        .badge-skill {
            background: rgba(102,126,234,0.3);
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            display: inline-block;
            margin: 2px;
        }
    </style>
</head>
<body>
<div class="main-wrapper">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">📝 <span>CMS</span></div>
        <nav>
            <div class="nav-item"><a href="/dashboard" class="nav-link"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></div>
            <div class="nav-item"><a href="/articles" class="nav-link"><i class="fas fa-newspaper"></i> <span>Articles</span></a></div>
            <div class="nav-item"><a href="/categories" class="nav-link"><i class="fas fa-folder"></i> <span>Categories</span></a></div>
            <div class="nav-item"><a href="/tags" class="nav-link"><i class="fas fa-tags"></i> <span>Tags</span></a></div>
            <div class="nav-item"><a href="/pages" class="nav-link"><i class="fas fa-file"></i> <span>Pages</span></a></div>
            <div class="nav-item"><a href="/media" class="nav-link"><i class="fas fa-images"></i> <span>Media</span></a></div>
            <div class="nav-item"><a href="/comments" class="nav-link"><i class="fas fa-comments"></i> <span>Comments</span></a></div>
            <div class="nav-item"><a href="/menus" class="nav-link"><i class="fas fa-bars"></i> <span>Menus</span></a></div>
            <div class="nav-item"><a href="/products" class="nav-link"><i class="fas fa-box"></i> <span>Products</span></a></div>
            <div class="nav-item"><a href="/widgets" class="nav-link"><i class="fas fa-puzzle-piece"></i> <span>Widgets</span></a></div>
            <div class="nav-item"><a href="/forms" class="nav-link"><i class="fas fa-file-alt"></i> <span>Forms</span></a></div>
            <div class="nav-item"><a href="/faqs" class="nav-link"><i class="fas fa-question-circle"></i> <span>FAQs</span></a></div>
            <div class="nav-item"><a href="/testimonials" class="nav-link"><i class="fas fa-star"></i> <span>Testimonials</span></a></div>
            <div class="nav-item"><a href="/events" class="nav-link"><i class="fas fa-calendar"></i> <span>Events</span></a></div>
            <div class="nav-item"><a href="/calendar" class="nav-link"><i class="fas fa-calendar-alt"></i> <span>Calendar</span></a></div>
            <div class="nav-item"><a href="/portfolios" class="nav-link active"><i class="fas fa-briefcase"></i> <span>Portfolios</span></a></div>
            <div class="nav-item"><a href="/jobs" class="nav-link"><i class="fas fa-briefcase"></i> <span>Jobs</span></a></div>
            <div class="nav-item"><a href="/news" class="nav-link"><i class="fas fa-bullhorn"></i> <span>News</span></a></div>
            <div class="nav-item"><a href="/backup" class="nav-link"><i class="fas fa-database"></i> <span>Backup</span></a></div>
            <div class="nav-item"><a href="/version-history" class="nav-link"><i class="fas fa-history"></i> <span>Versions</span></a></div>
            <div class="nav-item"><a href="/users" class="nav-link"><i class="fas fa-users"></i> <span>Users</span></a></div>
        </nav>
    </div>

    <div class="main-content">
        <!-- Top Bar -->
        <div class="top-bar">
            <h1>💼 Portfolios</h1>
            <div class="user-info">
                <i class="fas fa-user-circle" style="font-size:22px;"></i>
                <span>Admin</span>
                <a href="/logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>

        <!-- Add/Edit Form -->
        <div class="glass-card">
            <h5 class="card-title" id="formTitle"><i class="fas fa-plus"></i> Add New Portfolio</h5>
            <form id="portfolioForm">
                <div class="row">
                    <div class="col-md-6 mb-3"><label>Title *</label><input type="text" id="portfolioTitle" class="form-control" placeholder="Project title" required></div>
                    <div class="col-md-6 mb-3"><label>Category</label><input type="text" id="portfolioCategory" class="form-control" placeholder="e.g., Web Development, Design"></div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3"><label>Client</label><input type="text" id="portfolioClient" class="form-control" placeholder="Client name"></div>
                    <div class="col-md-4 mb-3"><label>Skills</label><input type="text" id="portfolioSkills" class="form-control" placeholder="e.g., Java, Spring, React"></div>
                    <div class="col-md-4 mb-3"><label>Status</label><select id="portfolioStatus" class="form-select"><option value="PUBLISHED">Published</option><option value="DRAFT">Draft</option></select></div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label>Project URL</label><input type="url" id="portfolioProjectUrl" class="form-control" placeholder="https://example.com"></div>
                    <div class="col-md-6 mb-3"><label>Image URL</label><input type="url" id="portfolioImageUrl" class="form-control" placeholder="https://example.com/image.jpg"></div>
                </div>
                <div class="mb-3"><label>Description</label><textarea id="portfolioDescription" rows="4" class="form-control" placeholder="Project description..."></textarea></div>
                <button type="submit" class="btn-glass success" id="submitBtn"><i class="fas fa-save"></i> Add Portfolio</button>
                <button type="button" class="btn-glass warning" id="cancelBtn" style="display:none;" onclick="clearForm()"><i class="fas fa-times"></i> Cancel</button>
            </form>
        </div>

        <!-- Portfolios Table -->
        <div class="glass-card">
            <h5 class="card-title"><i class="fas fa-list"></i> All Portfolios</h5>
            <div class="table-responsive">
                <table class="table">
                    <thead><tr><th>ID</th><th>Image</th><th>Title</th><th>Category</th><th>Client</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="portfoliosBody"><tr><td colspan="7" class="text-center text-white-50">Loading portfolios...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script>
    toastr.options = { "closeButton": true, "progressBar": true, "positionClass": "toast-top-right", "timeOut": "3000" };

    let editingId = null;

    function loadPortfolios() {
        fetch('/api/portfolios')
            .then(r => r.json())
            .then(portfolios => {
                const tbody = document.getElementById('portfoliosBody');
                tbody.innerHTML = '';
                if (!portfolios || portfolios.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-white-50">No portfolios found</td></tr>';
                    return;
                }
                portfolios.forEach(p => {
                    const statusBadge = p.status === 'PUBLISHED' ? '<span class="badge-success">Published</span>' : '<span class="badge-warning">Draft</span>';
                    const imageHtml = p.imageUrl ? `<img src="${p.imageUrl}" class="preview-img" alt="${p.title}">` : `<div class="preview-img-placeholder"><i class="fas fa-image"></i></div>`;
                    const skills = p.skills ? p.skills.split(',').map(s => `<span class="badge-skill">${s.trim()}</span>`).join('') : '—';
                    tbody.innerHTML += `<tr>
                        <td>${p.id}</td>
                        <td>${imageHtml}</td>
                        <td><strong>${p.title}</strong></td>
                        <td>${p.category || '—'}</td>
                        <td>${p.client || '—'}</td>
                        <td>${statusBadge}</td>
                        <td>
                            <button class="btn-glass warning btn-sm" onclick="editPortfolio(${p.id})"><i class="fas fa-edit"></i></button>
                            <button class="btn-glass danger btn-sm" onclick="deletePortfolio(${p.id})"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
                });
            })
            .catch(() => toastr.error('Failed to load portfolios'));
    }

    document.getElementById('portfolioForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const title = document.getElementById('portfolioTitle').value.trim();
        if (!title) { toastr.warning('Title is required'); return; }

        const portfolio = {
            title,
            description: document.getElementById('portfolioDescription').value,
            client: document.getElementById('portfolioClient').value.trim(),
            category: document.getElementById('portfolioCategory').value.trim(),
            skills: document.getElementById('portfolioSkills').value.trim(),
            projectUrl: document.getElementById('portfolioProjectUrl').value.trim(),
            imageUrl: document.getElementById('portfolioImageUrl').value.trim(),
            status: document.getElementById('portfolioStatus').value
        };

        const method = editingId ? 'PUT' : 'POST';
        const url = editingId ? `/api/portfolios/${editingId}` : '/api/portfolios';

        fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(portfolio)
        })
            .then(r => r.json())
            .then(() => {
                clearForm();
                loadPortfolios();
                toastr.success(editingId ? 'Portfolio updated!' : 'Portfolio added!');
            })
            .catch(() => toastr.error('Failed to save portfolio'));
    });

    function editPortfolio(id) {
        fetch(`/api/portfolios/${id}`)
            .then(r => r.json())
            .then(p => {
                editingId = id;
                document.getElementById('portfolioTitle').value = p.title;
                document.getElementById('portfolioDescription').value = p.description || '';
                document.getElementById('portfolioClient').value = p.client || '';
                document.getElementById('portfolioCategory').value = p.category || '';
                document.getElementById('portfolioSkills').value = p.skills || '';
                document.getElementById('portfolioProjectUrl').value = p.projectUrl || '';
                document.getElementById('portfolioImageUrl').value = p.imageUrl || '';
                document.getElementById('portfolioStatus').value = p.status || 'PUBLISHED';
                document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit"></i> Edit Portfolio';
                document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Update Portfolio';
                document.getElementById('submitBtn').className = 'btn-glass primary';
                document.getElementById('cancelBtn').style.display = 'inline-block';
            })
            .catch(() => toastr.error('Failed to load portfolio'));
    }

    function deletePortfolio(id) {
        if (confirm('Delete this portfolio?')) {
            fetch(`/api/portfolios/${id}`, { method: 'DELETE' })
                .then(() => {
                    loadPortfolios();
                    toastr.success('Portfolio deleted');
                })
                .catch(() => toastr.error('Failed to delete'));
        }
    }

    function clearForm() {
        editingId = null;
        document.getElementById('portfolioTitle').value = '';
        document.getElementById('portfolioDescription').value = '';
        document.getElementById('portfolioClient').value = '';
        document.getElementById('portfolioCategory').value = '';
        document.getElementById('portfolioSkills').value = '';
        document.getElementById('portfolioProjectUrl').value = '';
        document.getElementById('portfolioImageUrl').value = '';
        document.getElementById('portfolioStatus').value = 'PUBLISHED';
        document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus"></i> Add New Portfolio';
        document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Add Portfolio';
        document.getElementById('submitBtn').className = 'btn-glass success';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    loadPortfolios();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
