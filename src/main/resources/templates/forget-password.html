<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
    <script src="/js/dark-mode.js" defer></script>
    <script src="/js/theme-switcher.js" defer></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            margin: 0;
            overflow: hidden;
        }
        [data-theme="dark"] body {
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a2e 100%);
        }
        [data-theme="blue"] body {
            background: linear-gradient(135deg, #0c3483 0%, #a2b6df 100%);
        }
        [data-theme="green"] body {
            background: linear-gradient(135deg, #0c5234 0%, #85c9a2 100%);
        }
        [data-theme="purple"] body {
            background: linear-gradient(135deg, #4a0e78 0%, #c084e8 100%);
        }
        [data-theme="sunset"] body {
            background: linear-gradient(135deg, #f12711 0%, #f5af19 100%);
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
            top: -150px;
            right: -150px;
            animation: float 14s ease-in-out infinite;
            z-index: 0;
        }
        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
            bottom: -100px;
            left: -100px;
            animation: float 10s ease-in-out infinite reverse;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-40px) rotate(15deg); }
        }

        .reset-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 50px 40px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.25);
            max-width: 450px;
            width: 100%;
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }
        .reset-card:hover {
            box-shadow: 0 35px 100px rgba(0, 0, 0, 0.35);
        }

        .reset-card .brand {
            text-align: center;
            margin-bottom: 30px;
        }
        .reset-card .brand h3 {
            font-weight: 700;
            color: white;
            font-size: 32px;
            letter-spacing: -0.5px;
        }
        .reset-card .brand h3 span {
            color: #ffd700;
        }
        .reset-card .brand p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            margin-top: 5px;
        }

        .reset-card .form-control {
            background: rgba(255, 255, 255, 0.12) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: white !important;
            border-radius: 16px;
            padding: 14px 20px;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        .reset-card .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .reset-card .form-control:focus {
            background: rgba(255, 255, 255, 0.2) !important;
            border-color: rgba(255, 255, 255, 0.5) !important;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.08);
        }

        .reset-card .input-group-text {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-right: none !important;
            color: rgba(255, 255, 255, 0.7) !important;
            border-radius: 16px 0 0 16px;
            padding: 0 18px;
        }
        .reset-card .input-group .form-control {
            border-radius: 0 16px 16px 0;
            border-left: none !important;
        }

        .reset-card .btn-reset {
            border-radius: 16px;
            padding: 14px;
            font-weight: 600;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            color: white;
            width: 100%;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(17, 153, 142, 0.3);
            margin-top: 10px;
        }
        .reset-card .btn-reset:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 15px 40px rgba(17, 153, 142, 0.45);
        }
        .reset-card .btn-reset i {
            margin-right: 8px;
        }

        .reset-card .form-footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }
        .reset-card .form-footer a {
            color: #ffd700;
            text-decoration: none;
            font-weight: 600;
        }
        .reset-card .form-footer a:hover {
            text-decoration: underline;
        }

        #message .alert {
            border-radius: 16px;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
        }

        @media (max-width: 480px) {
            .reset-card {
                padding: 30px 20px;
                margin: 20px;
                border-radius: 20px;
            }
            .reset-card .brand h3 { font-size: 26px; }
            body::before, body::after { display: none; }
        }
    </style>
</head>
<body>
<div class="reset-card">
    <div class="brand">
        <h3>📝 <span>CMS</span></h3>
        <p>Reset your password</p>
    </div>

    <form id="resetForm">
        <div class="mb-3">
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
            </div>
        </div>
        <button type="submit" class="btn-reset"><i class="fas fa-paper-plane"></i> Send Reset Link</button>
        <div id="message" class="mt-3 text-center"></div>
    </form>

    <div class="form-footer">
        Remember your password? <a href="/login">Sign In</a>
    </div>
</div>

<script>
    // ===== Form Submit =====
    document.getElementById('resetForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();

        if (!email) {
            document.getElementById('message').innerHTML = '<div class="alert alert-warning">Please enter your email</div>';
            return;
        }

        fetch('/api/users/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        })
            .then(r => r.text())
            .then(data => {
                document.getElementById('message').innerHTML = `<div class="alert alert-success">✅ ${data}</div>`;
                document.getElementById('resetForm').reset();
            })
            .catch(err => {
                document.getElementById('message').innerHTML = `<div class="alert alert-danger">❌ Failed to send reset link. Please try again.</div>`;
            });
    });

    // ===== Auto-focus email on load =====
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('email').focus();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
