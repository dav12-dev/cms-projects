<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .register-card .brand {
            text-align: center;
            margin-bottom: 30px;
        }
        .register-card .brand h3 {
            font-weight: 700;
            color: #333;
        }
        .register-card .brand span {
            color: #f5576c;
        }
        .register-card .form-control {
            border-radius: 30px;
            padding: 12px 20px;
        }
        .register-card .btn-register {
            border-radius: 30px;
            padding: 12px;
            font-weight: 600;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            color: white;
            width: 100%;
        }
        .register-card .btn-register:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .register-card a {
            color: #f5576c;
            text-decoration: none;
        }
        .register-card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="register-card">
    <div class="brand">
        <h3>📝 <span>Register</span></h3>
        <p class="text-muted">Create your account</p>
    </div>

    <form id="registerForm">
        <div class="mb-3">
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fas fa-user"></i></span>
                <input type="text" id="fullName" class="form-control" placeholder="Full Name" required>
            </div>
        </div>
        <div class="mb-3">
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fas fa-envelope"></i></span>
                <input type="email" id="email" class="form-control" placeholder="Email Address" required>
            </div>
        </div>
        <div class="mb-3">
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Password" required>
            </div>
        </div>
        <button type="submit" class="btn-register">
            <i class="fas fa-user-plus"></i> Register
        </button>
        <div id="message" class="mt-3 text-center"></div>
    </form>

    <p class="text-center mt-3">
        Already have an account? <a href="/login">Sign In</a>
    </p>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = {
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            role: 'USER'
        };
        fetch('/api/users/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(user)
        })
            .then(response => response.text())
            .then(data => {
                document.getElementById('message').innerHTML =
                    '<div class="alert alert-success">✅ ' + data + ' Redirecting to login...</div>';
                setTimeout(() => window.location.href = '/login', 2000);
            })
            .catch(error => {
                document.getElementById('message').innerHTML =
                    '<div class="alert alert-danger">❌ Registration failed. Try again.</div>';
            });
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
