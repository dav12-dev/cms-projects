<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ====== Styles ====== */
        body {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255,255,255,0.04);
            border-radius: 50%;
            top: -150px;
            right: -150px;
            animation: float 14s ease-in-out infinite;
            z-index: 0;
        }
        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255,255,255,0.04);
            border-radius: 50%;
            bottom: -100px;
            left: -100px;
            animation: float 10s ease-in-out infinite reverse;
            z-index: 0;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-40px) rotate(15deg); }
        }
        .register-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 28px;
            padding: 50px 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.25);
            max-width: 480px;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        .register-card .brand { text-align: center; margin-bottom: 30px; }
        .register-card .brand h3 { font-weight: 700; color: white; font-size: 32px; }
        .register-card .brand h3 span { color: #ffd700; }
        .register-card .brand p { color: rgba(255,255,255,0.7); font-size: 15px; margin-top: 5px; }
        .register-card .form-control {
            background: rgba(255,255,255,0.12) !important;
            border: 1px solid rgba(255,255,255,0.2) !important;
            color: white !important;
            border-radius: 16px;
            padding: 14px 20px;
            font-size: 15px;
        }
        .register-card .form-control::placeholder { color: rgba(255,255,255,0.5); }
        .register-card .form-control:focus {
            background: rgba(255,255,255,0.2) !important;
            border-color: rgba(255,255,255,0.5) !important;
            box-shadow: 0 0 30px rgba(255,255,255,0.08);
        }
        .register-card .input-group-text {
            background: rgba(255,255,255,0.08) !important;
            border: 1px solid rgba(255,255,255,0.2) !important;
            border-right: none !important;
            color: rgba(255,255,255,0.7) !important;
            border-radius: 16px 0 0 16px;
            padding: 0 18px;
        }
        .register-card .input-group .form-control {
            border-radius: 0 16px 16px 0;
            border-left: none !important;
        }
        .register-card .btn-register {
            border-radius: 16px;
            padding: 14px;
            font-weight: 600;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            color: white;
            width: 100%;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(245,87,108,0.3);
            margin-top: 10px;
        }
        .register-card .btn-register:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 15px 40px rgba(245,87,108,0.45); }
        .register-card .password-strength {
            margin-top: 8px;
            height: 4px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .register-card .password-strength .bar {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: width 0.3s ease, background 0.3s ease;
        }
        .register-card .login-link { text-align: center; margin-top: 20px; color: rgba(255,255,255,0.6); font-size: 14px; }
        .register-card .login-link a { color: #ffd700; text-decoration: none; font-weight: 600; }
        .register-card .login-link a:hover { text-decoration: underline; }
        .register-card .social-login {
            margin-top: 25px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 25px;
        }
        .register-card .social-login p { color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 15px; }
        .register-card .social-login .btn-social {
            display: inline-block;
            width: 48px;
            height: 48px;
            line-height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            font-size: 18px;
            margin: 0 6px;
            transition: all 0.3s ease;
            cursor: default;
        }
        .register-card .social-login .btn-social:hover { background: rgba(255,255,255,0.2); transform: translateY(-3px); }
        .register-card .social-login .btn-social.google { color: #ea4335; }
        .register-card .social-login .btn-social.github { color: #f0f6fc; }
        .register-card .social-login .btn-social.facebook { color: #1877f2; }
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            z-index: 10;
        }
        .password-toggle:hover { color: rgba(255,255,255,0.8); }
        #registerMessage .alert { border-radius: 16px; backdrop-filter: blur(10px); background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); color: white; }
        @media (max-width: 480px) {
            .register-card { padding: 30px 20px; margin: 20px; border-radius: 20px; }
            .register-card .brand h3 { font-size: 26px; }
            body::before, body::after { display: none; }
        }
    </style>
</head>
<body>
<div class="register-card">
    <div class="brand">
        <h3>📝 <span>Register</span></h3>
        <p>Create your account</p>
    </div>
    <form id="registerForm">
        <div class="mb-3">
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input type="text" id="fullName" class="form-control" placeholder="Full Name" autocomplete="name" required>
            </div>
        </div>
        <div class="mb-3">
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                <input type="email" id="email" class="form-control" placeholder="Email Address" autocomplete="email" required>
            </div>
        </div>
        <div class="mb-3 position-relative">
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Password" autocomplete="new-password" required minlength="6">
                <button type="button" class="password-toggle" onclick="togglePassword()">
                    <i class="fas fa-eye" id="toggleIcon"></i>
                </button>
            </div>
            <div class="password-strength">
                <div class="bar" id="strengthBar"></div>
            </div>
        </div>
        <button type="submit" class="btn-register"><i class="fas fa-user-plus"></i> Register</button>
        <div id="registerMessage" class="mt-3 text-center"></div>
    </form>
    <div class="social-login">
        <p>Or sign up with</p>
        <div>
            <span class="btn-social google"><i class="fab fa-google"></i></span>
            <span class="btn-social github"><i class="fab fa-github"></i></span>
            <span class="btn-social facebook"><i class="fab fa-facebook-f"></i></span>
        </div>
    </div>
    <div class="login-link">
        Already have an account? <a href="/login">Sign In</a>
    </div>
</div>
<script>
    function togglePassword() {
        const input = document.getElementById('password');
        const icon = document.getElementById('toggleIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fas fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fas fa-eye';
        }
    }

    document.getElementById('password').addEventListener('input', function() {
        const bar = document.getElementById('strengthBar');
        const val = this.value;
        let strength = 0;
        if (val.length >= 6) strength += 25;
        if (val.match(/[a-z]/)) strength += 25;
        if (val.match(/[A-Z]/)) strength += 25;
        if (val.match(/[0-9!@#$%^&*]/)) strength += 25;
        bar.style.width = strength + '%';
        bar.style.background = strength <= 25 ? '#ff6b6b' : strength <= 50 ? '#ffd93d' : strength <= 75 ? '#6bcb77' : '#4d96ff';
    });

    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        if (!fullName || !email || !password) {
            document.getElementById('registerMessage').innerHTML = '<div class="alert alert-warning">All fields are required</div>';
            return;
        }
        if (password.length < 6) {
            document.getElementById('registerMessage').innerHTML = '<div class="alert alert-warning">Password must be at least 6 characters</div>';
            return;
        }
        const user = { fullName, email, password, role: 'USER' };
        fetch('/api/users/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(user)
        })
            .then(response => response.text())
            .then(data => {
                document.getElementById('registerMessage').innerHTML = `<div class="alert alert-success">✅ ${data} Redirecting...</div>`;
                setTimeout(() => window.location.href = '/login', 2000);
            })
            .catch(error => {
                document.getElementById('registerMessage').innerHTML = '<div class="alert alert-danger">❌ Registration failed. Please try again.</div>';
            });
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
