<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Articles - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-wrapper { display: flex; min-height: 100vh; }

        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px 20px;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
        }
        .sidebar .brand { color: white; font-size: 28px; font-weight: 700; text-align: center; padding-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 30px; }
        .sidebar .brand span { color: #ffd700; }
        .sidebar .nav-item { margin-bottom: 8px; }
        .sidebar .nav-link { color: rgba(255,255,255,0.7); padding: 12px 18px; border-radius: 12px; transition: all 0.3s ease; font-weight: 500; display: flex; align-items: center; gap: 12px; }
        .sidebar .nav-link:hover { background: rgba(255,255,255,0.2); color: white; transform: translateX(5px); }
        .sidebar .nav-link.active { background: rgba(255,255,255,0.25); color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .sidebar .nav-link i { width: 24px; text-align: center; }

        .main-content { margin-left: 280px; padding: 30px; width: calc(100% - 280px); min-height: 100vh; }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .glass-card .card-title { color: white; font-weight: 600; }
        .glass-card label { color: white; font-weight: 500; }

        .top-bar {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 15px 25px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar h1 { color: white; font-weight: 700; margin: 0; }
        .top-bar .user-info { color: white; display: flex; align-items: center; gap: 15px; }
        .top-bar .user-info .logout-btn { color: #ff6b6b; text-decoration: none; font-weight: 500; }
        .top-bar .user-info .logout-btn:hover { color: #ff4757; }

        .form-control, .form-select {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 12px;
            padding: 12px 18px;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.5); }
        .form-control:focus, .form-select:focus {
            background: rgba(255,255,255,0.25);
            color: white;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.4);
        }
        .form-select option { color: #333; }

        .btn-glass {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-glass:hover { background: rgba(255,255,255,0.3); color: white; transform: scale(1.02); }
        .btn-glass.success { background: rgba(46, 204, 113, 0.6); }
        .btn-glass.primary { background: rgba(102, 126, 234, 0.6); }
        .btn-glass.warning { background: rgba(241, 196, 15, 0.6); }
        .btn-glass.danger { background: rgba(231, 76, 60, 0.6); }

        .table {
            color: white;
        }
        .table thead th {
            border-bottom: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.8);
            font-weight: 600;
        }
        .table tbody td {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            vertical-align: middle;
        }
        .table tbody tr:hover {
            background: rgba(255,255,255,0.05);
        }

        .badge-success { background: rgba(46, 204, 113, 0.8); color: white; padding: 5px 15px; border-radius: 20px; }
        .badge-warning { background: rgba(241, 196, 15, 0.8); color: white; padding: 5px 15px; border-radius: 20px; }

        @media (max-width: 768px) {
            .sidebar { width: 80px; padding: 20px 10px; }
            .sidebar .brand { font-size: 18px; }
            .sidebar .nav-link span { display: none; }
            .main-content { margin-left: 80px; width: calc(100% - 80px); padding: 15px; }
        }
    </style>
</head>
<body>
<div class="main-wrapper">
    <div class="sidebar">
        <div class="brand">📝 <span>CMS</span></div>
        <nav>
            <div class="nav-item"><a href="/dashboard" class="nav-link"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></div>
            <div class="nav-item"><a href="/articles" class="nav-link active"><i class="fas fa-newspaper"></i> <span>Articles</span></a></div>
            <div class="nav-item"><a href="/categories" class="nav-link"><i class="fas fa-folder"></i> <span>Categories</span></a></div>
            <div class="nav-item"><a href="/users" class="nav-link"><i class="fas fa-users"></i> <span>Users</span></a></div>
        </nav>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <h1>📄 Articles</h1>
            <div class="user-info">
                <i class="fas fa-user-circle" style="font-size:24px;"></i>
                <span>Admin</span>
                <a href="/logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>

        <!-- Create Article -->
        <div class="glass-card">
            <h5 class="card-title" id="formTitle"><i class="fas fa-pen"></i> Create New Article</h5>
            <form id="articleForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Title</label>
                        <input type="text" id="articleTitle" class="form-control" placeholder="Enter article title..." required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label>Category</label>
                        <select id="articleCategory" class="form-select" required>
                            <option value="">Select Category...</option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label>Status</label>
                        <select id="articleStatus" class="form-select">
                            <option value="DRAFT">Draft</option>
                            <option value="PUBLISHED">Published</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label>Content</label>
                    <textarea id="articleContent" rows="5" class="form-control" placeholder="Write your article content here..." required></textarea>
                </div>
                <button type="submit" class="btn-glass success" id="submitBtn"><i class="fas fa-save"></i> Create Article</button>
                <button type="button" class="btn-glass warning" id="cancelBtn" style="display:none;" onclick="clearForm()"><i class="fas fa-times"></i> Cancel</button>
            </form>
        </div>

        <!-- Search -->
        <div class="glass-card">
            <div class="row">
                <div class="col-md-9">
                    <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search articles by title or content...">
                </div>
                <div class="col-md-3">
                    <button class="btn-glass primary" onclick="searchArticles()"><i class="fas fa-search"></i> Search</button>
                    <button class="btn-glass" onclick="clearSearch()"><i class="fas fa-undo"></i> Clear</button>
                </div>
            </div>
        </div>

        <!-- Articles Table -->
        <div class="glass-card">
            <h5 class="card-title"><i class="fas fa-list"></i> All Articles</h5>
            <div class="table-responsive">
                <table class="table">
                    <thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
                    <tbody id="articlesBody"><tr><td colspan="6" class="text-center text-white-50">Loading articles...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let editingId = null, categories = [], currentSearch = '';

    function loadCategories() {
        fetch('/api/categories')
            .then(r => r.json())
            .then(data => {
                categories = data;
                const select = document.getElementById('articleCategory');
                select.innerHTML = '<option value="">Select Category...</option>';
                data.forEach(cat => { select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`; });
            });
    }

    function loadArticles(keyword = '') {
        const url = keyword ? `/api/articles/search?keyword=${encodeURIComponent(keyword)}` : '/api/articles';
        fetch(url)
            .then(r => r.json())
            .then(articles => {
                const tbody = document.getElementById('articlesBody');
                tbody.innerHTML = '';
                if (articles.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="text-center text-white-50">No articles found</td></tr>'; return; }
                articles.forEach(a => {
                    const badge = a.status === 'PUBLISHED' ? '<span class="badge-success">Published</span>' : '<span class="badge-warning">Draft</span>';
                    tbody.innerHTML += `<tr>
                        <td>${a.id}</td>
                        <td><strong>${a.title}</strong></td>
                        <td>${a.category ? a.category.name : 'Uncategorized'}</td>
                        <td>${badge}</td>
                        <td>${a.createdAt ? new Date(a.createdAt).toLocaleDateString() : 'N/A'}</td>
                        <td>
                            <button class="btn-glass warning btn-sm" onclick="editArticle(${a.id})"><i class="fas fa-edit"></i></button>
                            <button class="btn-glass danger btn-sm" onclick="deleteArticle(${a.id})"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
                });
            });
    }

    function searchArticles() { const k = document.getElementById('searchInput').value.trim(); currentSearch = k; loadArticles(k); }
    function clearSearch() { document.getElementById('searchInput').value = ''; currentSearch = ''; loadArticles(); }
    document.getElementById('searchInput').addEventListener('keyup', e => { if (e.key === 'Enter') searchArticles(); });

    document.getElementById('articleForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const title = document.getElementById('articleTitle').value.trim();
        const content = document.getElementById('articleContent').value.trim();
        const categoryId = document.getElementById('articleCategory').value;
        const status = document.getElementById('articleStatus').value;
        if (!title || !content) { alert('Title and Content are required!'); return; }
        const article = { title, content, status, category: categoryId ? { id: parseInt(categoryId) } : null };
        const method = editingId ? 'PUT' : 'POST';
        const url = editingId ? `/api/articles/${editingId}` : '/api/articles';
        fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(article) })
            .then(r => r.json())
            .then(() => { clearForm(); loadArticles(currentSearch); alert('Article saved!'); });
    });

    function editArticle(id) {
        fetch(`/api/articles/${id}`)
            .then(r => r.json())
            .then(a => {
                editingId = id;
                document.getElementById('articleTitle').value = a.title;
                document.getElementById('articleContent').value = a.content;
                document.getElementById('articleStatus').value = a.status;
                document.getElementById('articleCategory').value = a.category ? a.category.id : '';
                document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit"></i> Edit Article';
                document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Update Article';
                document.getElementById('submitBtn').className = 'btn-glass primary';
                document.getElementById('cancelBtn').style.display = 'inline-block';
            });
    }

    function deleteArticle(id) {
        if (confirm('Delete this article?')) { fetch(`/api/articles/${id}`, { method: 'DELETE' }).then(() => loadArticles(currentSearch)); }
    }

    function clearForm() {
        editingId = null;
        document.getElementById('articleTitle').value = '';
        document.getElementById('articleContent').value = '';
        document.getElementById('articleCategory').value = '';
        document.getElementById('articleStatus').value = 'DRAFT';
        document.getElementById('formTitle').innerHTML = '<i class="fas fa-pen"></i> Create New Article';
        document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Create Article';
        document.getElementById('submitBtn').className = 'btn-glass success';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    loadCategories(); loadArticles();
</script>
</body>
</html>
