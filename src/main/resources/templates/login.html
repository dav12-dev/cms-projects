<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ====== Styles (same as before) ====== */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255,255,255,0.04);
            border-radius: 50%;
            top: -150px;
            right: -150px;
            animation: float 14s ease-in-out infinite;
            z-index: 0;
        }
        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255,255,255,0.04);
            border-radius: 50%;
            bottom: -100px;
            left: -100px;
            animation: float 10s ease-in-out infinite reverse;
            z-index: 0;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-40px) rotate(15deg); }
        }
        .login-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 28px;
            padding: 50px 40px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.25);
            max-width: 450px;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        .login-card .brand { text-align: center; margin-bottom: 35px; }
        .login-card .brand h3 { font-weight: 700; color: white; font-size: 32px; }
        .login-card .brand h3 span { color: #ffd700; }
        .login-card .brand p { color: rgba(255,255,255,0.7); font-size: 15px; margin-top: 5px; }
        .login-card .form-control {
            background: rgba(255,255,255,0.12) !important;
            border: 1px solid rgba(255,255,255,0.2) !important;
            color: white !important;
            border-radius: 16px;
            padding: 14px 20px;
            font-size: 15px;
        }
        .login-card .form-control::placeholder { color: rgba(255,255,255,0.5); }
        .login-card .form-control:focus {
            background: rgba(255,255,255,0.2) !important;
            border-color: rgba(255,255,255,0.5) !important;
            box-shadow: 0 0 30px rgba(255,255,255,0.08);
        }
        .login-card .input-group-text {
            background: rgba(255,255,255,0.08) !important;
            border: 1px solid rgba(255,255,255,0.2) !important;
            border-right: none !important;
            color: rgba(255,255,255,0.7) !important;
            border-radius: 16px 0 0 16px;
            padding: 0 18px;
        }
        .login-card .input-group .form-control {
            border-radius: 0 16px 16px 0;
            border-left: none !important;
        }
        .login-card .btn-login {
            border-radius: 16px;
            padding: 14px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            width: 100%;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102,126,234,0.3);
            margin-top: 10px;
        }
        .login-card .btn-login:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 15px 40px rgba(102,126,234,0.45); }
        .login-card .form-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .login-card .form-footer a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; transition: all 0.3s ease; }
        .login-card .form-footer a:hover { color: #ffd700; text-decoration: underline; }
        .login-card .form-check-label { color: rgba(255,255,255,0.7); font-size: 14px; }
        .login-card .form-check-input { background-color: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }
        .login-card .social-login { margin-top: 25px; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 25px; }
        .login-card .social-login p { color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 15px; }
        .login-card .social-login .btn-social {
            display: inline-block;
            width: 48px;
            height: 48px;
            line-height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            font-size: 18px;
            margin: 0 6px;
            transition: all 0.3s ease;
            cursor: default;
        }
        .login-card .social-login .btn-social:hover { background: rgba(255,255,255,0.2); transform: translateY(-3px); }
        .login-card .social-login .btn-social.google { color: #ea4335; }
        .login-card .social-login .btn-social.github { color: #f0f6fc; }
        .login-card .social-login .btn-social.facebook { color: #1877f2; }
        .login-card .register-link { text-align: center; margin-top: 20px; color: rgba(255,255,255,0.6); font-size: 14px; }
        .login-card .register-link a { color: #ffd700; text-decoration: none; font-weight: 600; }
        .login-card .register-link a:hover { text-decoration: underline; }
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            z-index: 10;
        }
        .password-toggle:hover { color: rgba(255,255,255,0.8); }
        @media (max-width: 480px) {
            .login-card { padding: 30px 20px; margin: 20px; border-radius: 20px; }
            .login-card .brand h3 { font-size: 26px; }
            body::before, body::after { display: none; }
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="brand">
        <h3>📝 <span>CMS</span></h3>
        <p>Content Management System</p>
    </div>
    <!-- 👇 Changed to th:action and added CSRF input (even though it's disabled, it's safe) -->
    <form th:action="@{/login}" method="post">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
        <div class="mb-3">
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                <input type="email" name="username" class="form-control" placeholder="Email Address" autocomplete="email" required>
            </div>
        </div>
        <div class="mb-3 position-relative">
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" class="form-control" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
                <button type="button" class="password-toggle" onclick="togglePassword()">
                    <i class="fas fa-eye" id="toggleIcon"></i>
                </button>
            </div>
        </div>
        <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Sign In</button>
    </form>
    <div class="form-footer">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        <a href="/forgot-password">Forgot password?</a>
    </div>
    <div class="social-login">
        <p>Or continue with</p>
        <div>
            <span class="btn-social google"><i class="fab fa-google"></i></span>
            <span class="btn-social github"><i class="fab fa-github"></i></span>
            <span class="btn-social facebook"><i class="fab fa-facebook-f"></i></span>
        </div>
    </div>
    <div class="register-link">
        Don't have an account? <a href="/register">Register</a>
    </div>
</div>
<script>
    function togglePassword() {
        const input = document.getElementById('loginPassword');
        const icon = document.getElementById('toggleIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fas fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fas fa-eye';
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
