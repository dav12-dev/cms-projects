<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-wrapper { display: flex; min-height: 100vh; }

        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px 20px;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
        }
        .sidebar .brand { color: white; font-size: 28px; font-weight: 700; text-align: center; padding-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 30px; }
        .sidebar .brand span { color: #ffd700; }
        .sidebar .nav-item { margin-bottom: 8px; }
        .sidebar .nav-link { color: rgba(255,255,255,0.7); padding: 12px 18px; border-radius: 12px; transition: all 0.3s ease; font-weight: 500; display: flex; align-items: center; gap: 12px; }
        .sidebar .nav-link:hover { background: rgba(255,255,255,0.2); color: white; transform: translateX(5px); }
        .sidebar .nav-link.active { background: rgba(255,255,255,0.25); color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .sidebar .nav-link i { width: 24px; text-align: center; }

        .main-content { margin-left: 280px; padding: 30px; width: calc(100% - 280px); min-height: 100vh; }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .glass-card .card-title { color: white; font-weight: 600; }

        .top-bar {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 15px 25px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar h1 { color: white; font-weight: 700; margin: 0; }
        .top-bar .user-info { color: white; display: flex; align-items: center; gap: 15px; }
        .top-bar .user-info .logout-btn { color: #ff6b6b; text-decoration: none; font-weight: 500; }
        .top-bar .user-info .logout-btn:hover { color: #ff4757; }

        .btn-glass {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 12px;
        }
        .btn-glass:hover { background: rgba(255,255,255,0.3); color: white; transform: scale(1.02); }
        .btn-glass.danger { background: rgba(231, 76, 60, 0.6); }
        .btn-glass.warning { background: rgba(241, 196, 15, 0.6); }
        .btn-glass.secondary { background: rgba(149, 165, 166, 0.6); }
        .btn-glass.danger-sm { background: rgba(231, 76, 60, 0.6); padding: 5px 12px; font-size: 11px; }

        .table { color: white; }
        .table thead th { border-bottom: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.8); font-weight: 600; }
        .table tbody td { border-bottom: 1px solid rgba(255,255,255,0.1); vertical-align: middle; }
        .table tbody tr:hover { background: rgba(255,255,255,0.05); }

        .badge-admin { background: rgba(231, 76, 60, 0.8); color: white; padding: 5px 15px; border-radius: 20px; font-size: 12px; }
        .badge-editor { background: rgba(241, 196, 15, 0.8); color: white; padding: 5px 15px; border-radius: 20px; font-size: 12px; }
        .badge-user { background: rgba(149, 165, 166, 0.8); color: white; padding: 5px 15px; border-radius: 20px; font-size: 12px; }

        @media (max-width: 768px) {
            .sidebar { width: 80px; padding: 20px 10px; }
            .sidebar .brand { font-size: 18px; }
            .sidebar .nav-link span { display: none; }
            .main-content { margin-left: 80px; width: calc(100% - 80px); padding: 15px; }
        }
    </style>
</head>
<body>
<div class="main-wrapper">
    <div class="sidebar">
        <div class="brand">📝 <span>CMS</span></div>
        <nav>
            <div class="nav-item"><a href="/dashboard" class="nav-link"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></div>
            <div class="nav-item"><a href="/articles" class="nav-link"><i class="fas fa-newspaper"></i> <span>Articles</span></a></div>
            <div class="nav-item"><a href="/categories" class="nav-link"><i class="fas fa-folder"></i> <span>Categories</span></a></div>
            <div class="nav-item"><a href="/users" class="nav-link active"><i class="fas fa-users"></i> <span>Users</span></a></div>
        </nav>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <h1>👥 Users</h1>
            <div class="user-info">
                <i class="fas fa-user-circle" style="font-size:24px;"></i>
                <span>Admin</span>
                <a href="/logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>

        <div class="glass-card">
            <h5 class="card-title"><i class="fas fa-list"></i> All Users</h5>
            <div class="table-responsive">
                <table class="table">
                    <thead><tr><th>ID</th><th>Full Name</th><th>Email</th><th>Role</th><th>Actions</th></tr></thead>
                    <tbody id="usersBody"><tr><td colspan="5" class="text-center text-white-50">Loading users...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    function loadUsers() {
        fetch('/api/users/all')
            .then(r => r.json())
            .then(users => {
                const tbody = document.getElementById('usersBody');
                tbody.innerHTML = '';
                if (users.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-white-50">No users found</td></tr>'; return; }
                users.forEach(u => {
                    const badge = u.role === 'ADMIN' ? '<span class="badge-admin">ADMIN</span>' :
                        u.role === 'EDITOR' ? '<span class="badge-editor">EDITOR</span>' :
                            '<span class="badge-user">USER</span>';
                    tbody.innerHTML += `<tr>
                        <td>${u.id}</td>
                        <td><strong>${u.fullName}</strong></td>
                        <td>${u.email}</td>
                        <td>${badge}</td>
                        <td>
                            <button class="btn-glass danger btn-sm" onclick="setRole(${u.id}, 'ADMIN')"><i class="fas fa-star"></i> Admin</button>
                            <button class="btn-glass warning btn-sm" onclick="setRole(${u.id}, 'EDITOR')"><i class="fas fa-pen"></i> Editor</button>
                            <button class="btn-glass secondary btn-sm" onclick="setRole(${u.id}, 'USER')"><i class="fas fa-user"></i> User</button>
                            <button class="btn-glass danger-sm" onclick="deleteUser(${u.id})"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
                });
            });
    }

    function setRole(id, role) {
        if (confirm(`Set role to ${role}?`)) {
            fetch(`/api/users/${id}/role`, { method: 'PUT', headers: { 'Content-Type': 'application/text' }, body: role })
                .then(() => loadUsers());
        }
    }

    function deleteUser(id) {
        if (confirm('Delete this user?')) { fetch(`/api/users/${id}`, { method: 'DELETE' }).then(() => loadUsers()); }
    }

    loadUsers();
</script>
</body>
</html>
